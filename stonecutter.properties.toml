[fabric]
deps.fabric-loader = "0.19.2"

[fabric."1.17.1"]
deps.minecraft = "1.17.1"
deps.fabric-api = "0.46.1+1.17"
deps.modmenu = "2.0.17"

[fabric."1.18.1"]
deps.minecraft = "1.18.1"
deps.minecraft-range = ">=1.18 <1.18.2"
deps.fabric-api = "0.46.6+1.18"
# 0.46.6+1.18 is the last fabric-api build ever published for 1.18/1.18.1 -
# it predates the "fabric" -> "fabric-api" mod id rename (confirmed via its
# own fabric.mod.json: id="fabric", no "provides" alias), unlike every later
# release we depend on elsewhere which has id="fabric-api" with
# provides=["fabric"]. Without this override, Fabric Loader reports
# "requires fabric-api ... which is missing" even though the jar (and every
# fabric-api-* submodule) IS present and loaded under the old id.
deps.fabric-api-id = "fabric"
deps.modmenu = "3.0.1"
publish.additionalVersions = ["1.18"]
# BadPackets has zero published versions this far back (confirmed via
# narrow per-version Modrinth query) - but that's not actually blocking:
# wthit-fabric-4.5.5 (the last WTHIT release covering 1.18/1.18.1) was
# published a month before BadPackets' own first-ever release, so it never
# depends on it at all (confirmed via its real fabric.mod.json - only
# fabricloader/fabric listed). Same old-API generation, pre-goat-horn API
# surface, and fabric.mod.json-custom-value plugin discovery as 1.18.2 -
# wired via the same wthit_plugin_legacy && <1.19 branch.
deps.wthit-legacy-api = true
deps.wthit-legacy-fabric-mod-json = true
deps.wthit = "4.5.5"

[fabric."1.18.2"]
deps.minecraft = "1.18.2"
deps.fabric-api = "0.77.0+1.18.2"
deps.modmenu = "3.2.5"
# wthit-fabric-4.13.6 (the latest available for 1.18.2) only ships the old
# unified IWailaPlugin at runtime, not the split common/client interfaces -
# confirmed by inspecting the jar directly. 1.18.2 also predates goat horns
# entirely (added in 1.19's Wild Update) - Goat#createHorn() doesn't exist
# on this version's class at all, and Component.translatable isn't
# available as a static factory here either (confirmed via javap on the
# real mapped jar) - needed a separate wthit_plugin_legacy && <1.19 code
# branch (no icon support, direct TranslatableComponent/TextComponent
# construction) rather than reusing the >=1.19 legacy branch as-is.
# Also, unlike every other legacy version, 4.13.6 doesn't read
# waila_plugins.json at all - it reads a "waila:plugins" custom value
# directly inside fabric.mod.json instead (confirmed via
# FabricPluginLoader.java's gatherPlugins()), wired via
# deps.wthit-legacy-fabric-mod-json in Loader.kt.
deps.wthit-legacy-api = true
deps.wthit-legacy-fabric-mod-json = true
deps.wthit = "4.13.6"
deps.badpackets = "0.1.3"

[fabric."1.19.2"]
deps.minecraft = "1.19.2"
deps.minecraft-range = ">=1.19 <1.19.3"
deps.fabric-api = "0.77.0+1.19.2"
deps.modmenu = "4.2.0-beta.2"
deps.wthit = "5.36.1"
deps.badpackets = "0.2.3"
publish.additionalVersions = ["1.19", "1.19.1"]

[fabric."1.19.3"]
deps.minecraft = "1.19.3"
deps.fabric-api = "0.69.0+1.19.3"
deps.modmenu = "5.1.0"
# wthit-fabric-6.7.1 (the only release for this patch) ships the old unified
# IWailaPlugin API at runtime, not the split common/client one - confirmed by
# inspecting the mod jar directly. The earlier attempt to compile against a
# newer wthit-api (5.36.1) as a fallback let it compile but crashed at
# runtime ("[WTHIT] Error creating instance of plugin markedgoats:plugin").
# Wired via the legacy plugin implementation (wthit_plugin_legacy) instead,
# compiling against 6.7.1's own matching wthit-api.
deps.wthit-legacy-api = true
deps.wthit = "6.7.1"
deps.badpackets = "0.3.6"

[fabric."1.19.4"]
deps.minecraft = "1.19.4"
deps.fabric-api = "0.87.2+1.19.4"
deps.modmenu = "6.3.1"
# Same reason as 1.19.3 above - wthit-fabric-7.6.1 is also the old
# unified-API generation at runtime.
deps.wthit-legacy-api = true
deps.wthit = "7.6.1"
deps.badpackets = "0.4.3"

