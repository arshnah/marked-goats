[fabric]
deps.fabric-loader = "0.19.2"

[fabric."1.17.1"]
deps.minecraft = "1.17.1"
deps.fabric-api = "0.46.1+1.17"
deps.modmenu = "2.0.17"

[fabric."1.18.1"]
deps.minecraft = "1.18.1"
deps.minecraft-range = ">=1.18 <1.18.2"
deps.fabric-api = "0.46.6+1.18"
# 0.46.6+1.18 is the last fabric-api build ever published for 1.18/1.18.1 -
# it predates the "fabric" -> "fabric-api" mod id rename (confirmed via its
# own fabric.mod.json: id="fabric", no "provides" alias), unlike every later
# release we depend on elsewhere which has id="fabric-api" with
# provides=["fabric"]. Without this override, Fabric Loader reports
# "requires fabric-api ... which is missing" even though the jar (and every
# fabric-api-* submodule) IS present and loaded under the old id.
deps.fabric-api-id = "fabric"
deps.modmenu = "3.0.1"
publish.additionalVersions = ["1.18"]
# No WTHIT: badpackets has zero published versions this far back
# (confirmed via narrow per-version Modrinth query, not just a bulk-query
# absence - see SESSION-HANDOFF.md for the bulk-query reliability caveat).

[fabric."1.18.2"]
deps.minecraft = "1.18.2"
deps.fabric-api = "0.77.0+1.18.2"
deps.modmenu = "3.2.5"
# No WTHIT: NOT the same reason as 1.18.1 above - badpackets (0.1.0-0.1.3)
# and wthit (4.7.1-4.13.6) both actually exist for 1.18.2, unlike 1.18/1.18.1.
# But the latest available, wthit-fabric-4.13.6, only ships the old unified
# IWailaPlugin at runtime (confirmed by inspecting the jar directly - no
# IWailaCommonPlugin/ICommonRegistrar/IClientRegistrar classes) - same
# incompatible-generation gap as 1.19.3/1.19.4/1.20.2/1.20.5/1.20.6, not a
# missing-dependency problem.

[fabric."1.19.2"]
deps.minecraft = "1.19.2"
deps.minecraft-range = ">=1.19 <1.19.3"
deps.fabric-api = "0.77.0+1.19.2"
deps.modmenu = "4.2.0-beta.2"
deps.wthit = "5.36.1"
deps.badpackets = "0.2.3"
publish.additionalVersions = ["1.19", "1.19.1"]

[fabric."1.19.3"]
deps.minecraft = "1.19.3"
deps.fabric-api = "0.69.0+1.19.3"
deps.modmenu = "5.1.0"
# No WTHIT: wthit-fabric-6.7.1 (the only release for this patch) ships the
# old unified IWailaPlugin API at runtime, not the split common/client one
# this branch targets - confirmed by inspecting the mod jar directly
# (no IWailaCommonPlugin/ICommonRegistrar classes present), not just the
# compile-only wthit-api artifact. Wiring deps.wthit-api="5.36.1" as a
# fallback lets it compile, but the plugin fails to instantiate at runtime
# ("[WTHIT] Error creating instance of plugin markedgoats:plugin") - same
# incompatible-generation gap as 1.20.2/1.20.5/1.20.6, not a version-range fix.

[fabric."1.19.4"]
deps.minecraft = "1.19.4"
deps.fabric-api = "0.87.2+1.19.4"
deps.modmenu = "6.3.1"
# No WTHIT: same reason as 1.19.3 above - wthit-fabric-7.6.1 is also the old
# unified-API generation at runtime.

[fabric."1.20.1"]
deps.minecraft = "1.20.1"
deps.minecraft-range = ">=1.20 <1.20.2"
deps.fabric-api = "0.92.11+1.20.1"
deps.modmenu = "7.2.2"
deps.wthit = "8.21.1"
deps.badpackets = "0.4.3"
publish.additionalVersions = ["1.20"]

[fabric."1.20.2"]
deps.minecraft = "1.20.2"
deps.fabric-api = "0.91.6+1.20.2"
deps.modmenu = "8.0.0"
# No WTHIT: fabric-9.x uses a different/older plugin API generation
# (unified IWailaPlugin, no IWailaCommonPlugin/IWailaClientPlugin/
# ICommonRegistrar split) that our MarkedGoatsWailaPlugin.java doesn't
# target - confirmed across 9.10.0/9.10.2/9.10.3, not just this one patch.

[fabric."1.20.4"]
deps.minecraft = "1.20.4"
deps.minecraft-range = ">=1.20.3 <1.20.5"
deps.fabric-api = "0.97.3+1.20.4"
deps.modmenu = "9.0.0"
deps.wthit = "10.11.1"
deps.badpackets = "0.6.2"
publish.additionalVersions = ["1.20.3"]

[fabric."1.20.6"]
